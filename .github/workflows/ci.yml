name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Python tests
        run: python3 -m unittest discover tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      # Gitleaks is free for personal repos; GITLEAKS_LICENSE is only
      # required for org-owned repos, which this is not.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No personal identifiers outside docs/private
        run: |
          set -e
          if git ls-files -z \
              | grep -zvE '^(\.github/|docs/superpowers/|docs/private/|static/dist/|frontend/node_modules/|docker-compose\.yml$)' \
              | xargs -0 --no-run-if-empty grep -nEi 'barjazz|tail82c219|tbarjadze|hetzner|tba-lin|100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|/root/'; then
            echo "Found personal identifiers outside docs/private/ - see matches above."
            exit 1
          fi
          echo "No personal identifiers found."
