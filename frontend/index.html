<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Claude RC · Multi-device</title>
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
<link rel="manifest" href="/static/manifest.json" />
<meta name="apple-mobile-web-app-title" content="Claude RC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a1a18" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a1a18'/><rect x='5' y='5' width='54' height='54' rx='11' fill='none' stroke='%233d3d39' stroke-width='2'/><text x='31' y='43' font-family='ui-monospace,Menlo,monospace' font-size='28' font-weight='700' fill='%23e8e7e3' text-anchor='middle'>rc</text><circle cx='50' cy='15' r='5' fill='%234ade80'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  /* Pin the document to the viewport so the header/nav (flex:none siblings
     of the scrolling content in App.tsx) can never be dragged along by an
     iOS Safari rubber-band bounce of the outer page: that bounce is what
     "header and bottom sidebar to be fixed not moving" was reporting. Each
     view's own content scrolls inside its own overflow:auto container;
     nothing here should ever need document-level scroll. overscroll-behavior
     additionally kills the bounce gesture itself where it's still possible
     (e.g. an inner list already at its scroll limit). */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: oklch(0.155 0.004 80); }
  body {
    position: fixed; inset: 0;
    font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: oklch(0.96 0.004 80);
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(201,100,66,.25); }
  /* 100% first as a fallback for browsers with no dvh support; 100dvh
     overrides it where supported so #root tracks the real visible
     viewport as the mobile browser's own chrome shows/hides, instead of
     the stale height 100% can report at that moment. */
  #root { height: 100%; height: 100dvh; }
  /* Removes the ~300ms tap delay and disables double-tap-to-zoom on
     buttons/links, so taps feel immediate rather than laggy on touch. */
  button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
</style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
