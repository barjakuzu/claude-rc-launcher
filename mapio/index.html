<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Mapio</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<!-- Top: search -->
<div id="top">
  <form id="search-form" autocomplete="off">
    <input id="q" type="search" placeholder="Search a place or address…" enterkeyhint="search">
    <button type="button" id="clear-q" class="ghost" aria-label="Clear">✕</button>
  </form>
  <ul id="results" hidden></ul>
</div>

<!-- Left: speed + route panel -->
<div id="hud">
  <div id="speed"><span id="speed-val">–</span><small>km/h</small></div>
</div>

<aside id="route-panel" hidden>
  <div class="rp-head">
    <div>
      <div id="rp-dest" class="rp-dest"></div>
      <div id="rp-sum" class="rp-sum"></div>
    </div>
    <button id="rp-close" class="btn" aria-label="End route">✕</button>
  </div>
  <div id="rp-next" class="rp-next"></div>
  <ol id="rp-steps"></ol>
</aside>

<!-- Right: controls -->
<div id="controls">
  <button id="zoom-in" class="btn" aria-label="Zoom in">＋</button>
  <button id="zoom-out" class="btn" aria-label="Zoom out">－</button>
  <button id="locate" class="btn" aria-label="Follow my location">◎</button>
  <button id="layers" class="btn" aria-label="Map style">▦</button>
</div>

<div id="layer-menu" hidden>
  <button data-layer="dark" class="opt">Dark</button>
  <button data-layer="light" class="opt">Light</button>
  <button data-layer="osm" class="opt">Streets</button>
  <button data-layer="sat" class="opt">Satellite</button>
</div>

<!-- Bottom sheet for a selected place -->
<div id="place" hidden>
  <div class="pl-text">
    <div id="pl-name" class="pl-name"></div>
    <div id="pl-addr" class="pl-addr"></div>
  </div>
  <button id="pl-go" class="btn primary">Directions</button>
  <button id="pl-close" class="btn" aria-label="Close">✕</button>
</div>

<div id="toast" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
